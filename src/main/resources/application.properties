spring.application.name=siperset
# Pengaturan Port Server
server.port=8080

# Pengaturan Koneksi Database H2 In-Memory (Sesuai Bab 6.2 DPPL)
spring.datasource.url=jdbc:h2:mem:db_siperset
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Aktifkan H2 Console di http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Pengaturan Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Batas Unggah Dokumen PDF Maksimal 10 MB (Sesuai Asumsi A03)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Penonaktifan Cache Template saat Development
spring.thymeleaf.cache=false