spring.application.name=siperset
# Pengaturan Port Server
server.port=8080

# Pengaturan Koneksi Database H2 In-Memory (Sesuai Bab 6.2 DPPL)
spring.datasource.url=jdbc:h2:mem:db_siperset
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Aktifkan H2 Console di http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Pengaturan Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Batas Unggah Server diset 20 MB agar validasi internal 10 MB (Alur Gagal A3) dapat menangkap berkas secara terkontrol
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Penonaktifan Cache Template saat Development
spring.thymeleaf.cache=false